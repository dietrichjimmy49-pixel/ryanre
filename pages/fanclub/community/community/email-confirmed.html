<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Ryan Reynolds Fan Club e-mail address has been confirmed.">
  <!-- Écran de confirmation, pas de contenu public unique : hors index,
       comme login.html et apply.html. -->
  <meta name="robots" content="noindex, follow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0D0D0D">
  <title>Email Confirmed - Ryan Reynolds Fan Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login-style.css">
  <style>
    /* Icône de succès — propre à cette page, pas besoin de l'ajouter au
       sprite SVG partagé de login.html pour un seul usage. */
    .confirmed-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: var(--color-accent-soft, rgba(245, 197, 24, 0.12));
      color: var(--color-accent);
    }
    .confirmed-icon svg { width: 30px; height: 30px; }
  </style>
</head>
<body>

  <a href="/" class="back-to-site">
    <span class="back-to-site__arrow" aria-hidden="true">←</span> Back to site
  </a>

  <main>
    <section class="login" aria-labelledby="confirmed-heading">
      <div class="login-card">

        <div class="confirmed-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>

        <header class="login-header">
          <p class="login-eyebrow">Application Received</p>
          <h1 class="login-title" id="confirmed-heading">Your e-mail is confirmed.</h1>
          <p class="login-subtitle">
            Thanks for confirming your address. Your application is now under review by our support team - we'll notify you by e-mail as soon as it's approved.
          </p>
        </header>

        <a href="login.html" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
          Go to Sign In
        </a>

      </div>
    </section>
  </main>

  <a href="/" class="scroll-home-btn" id="scroll-home-btn" aria-label="Back to home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5" />
      <path d="M5.5 9.5V19a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V9.5" />
    </svg>
  </a>

  <script src="assets/js/scroll-home-button.js"></script>
</body>
</html>
