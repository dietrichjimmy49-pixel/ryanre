<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <!-- Empêche le navigateur de proposer/forcer une traduction automatique
       de la page. translate="no" sur <html> est le standard suivi par la
       plupart des navigateurs ; le meta "google" ci-dessous cible en plus
       spécifiquement Google Translate (Chrome), qui ne respecte pas
       toujours l'attribut seul. -->
  <meta name="google" content="notranslate">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Verrou d'accès — en tout premier, avant tout le reste. -->
  <script>document.documentElement.style.visibility = "hidden";</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0D0D0D">
  <title>Members - Ryan Reynolds Fan Club Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/admin-shell.css">
  <link rel="stylesheet" href="styles/admin-components.css">
  <link rel="stylesheet" href="styles/members.css">
</head>
<body>

  <!-- ============================================
       TOPBAR — identique à Dashboard
  ============================================= -->
  <header class="topbar">
    <div class="topbar__brand">
      <button type="button" class="topbar__menu-toggle" id="sidebar-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="admin-sidebar">
        <span class="topbar__menu-bar"></span>
        <span class="topbar__menu-bar"></span>
        <span class="topbar__menu-bar"></span>
      </button>
      <span class="topbar__subtitle">Admin Panel</span>
    </div>

    <div class="topbar__account">
      <span class="topbar__account-label" id="topbar-account-label">Administrator</span>
      <span class="topbar__avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
      <span class="topbar__divider" aria-hidden="true"></span>
      <button class="topbar__logout js-logout" type="button">Logout</button>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

  <div class="app-shell">

    <!-- ============================================
         SIDEBAR — identique à Dashboard, "Members" actif
    ============================================= -->
    <aside class="sidebar" id="admin-sidebar">
      <button type="button" class="sidebar__close" id="sidebar-close" aria-label="Close menu">
        <span aria-hidden="true">&times;</span>
      </button>
      <p class="sidebar__label">Admin Panel</p>

      <nav class="sidebar__nav">
        <ul class="sidebar__nav-list">
          <li class="sidebar__nav-item">
            <a href="dashboard.html" class="sidebar__nav-link">
              <span class="sidebar__nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>
                </svg>
              </span>
              <span class="sidebar__nav-text">Dashboard</span>
              <span class="sidebar__nav-badge" id="sidebar-pending-badge" aria-label="Candidatures en attente">0</span>
            </a>
          </li>
          <li class="sidebar__nav-item sidebar__nav-item--active">
            <a href="members.html" class="sidebar__nav-link" aria-current="page">
              <span class="sidebar__nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              </span>
              <span class="sidebar__nav-text">Members</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar__footer">
        <a href="admin-login.html" class="sidebar__nav-link js-logout">
          <span class="sidebar__nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5"/>
              <path d="M21 12H9"/>
            </svg>
          </span>
          <span class="sidebar__nav-text">Logout</span>
        </a>
      </div>
    </aside>

    <!-- ============================================
         MAIN — deux vues, une seule visible à la fois
    ============================================= -->
    <main class="main">

      <!-- ---------- VUE LISTE ---------- -->
      <div id="members-list-view">

        <header class="page-header">
          <h1 class="page-header__title" id="members-page-title">Members</h1>
          <p class="page-header__subtitle">All approved members - Ryan Reynolds Fan Club</p>
        </header>

        <section class="stats" aria-label="Statistiques des membres">
          <article class="stat-card stat-card--success">
            <div class="stat-card__header">
              <span class="stat-card__label">Total Members</span>
              <span class="stat-card__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              </span>
            </div>
            <p class="stat-card__value" id="stat-total-members-value">0</p>
            <p class="stat-card__caption">Approved accounts</p>
          </article>
        </section>

        <!-- Barre d'outils de filtrage -->
        <form class="filter-form" role="search" onsubmit="return false">
          <label class="visually-hidden" for="member-search">Search</label>
          <input
            type="search"
            id="member-search"
            class="filter-form__search-input"
            placeholder="Search by name or email...">

          <label class="visually-hidden" for="country-filter">Country</label>
          <select id="country-filter" class="filter-form__select">
            <option value="all" selected>All Countries</option>
          </select>

          <label class="visually-hidden" for="sort-order">Sort</label>
          <select id="sort-order" class="filter-form__select">
            <option value="recent" selected>Most Recent</option>
            <option value="oldest">Oldest</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
          </select>
        </form>

        <div class="table-wrap">
          <table class="data-table" aria-describedby="members-table-caption">
            <caption class="visually-hidden" id="members-table-caption">List of approved club members</caption>
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Member</th>
                <th scope="col">Country</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="members-table-body">
              <!-- Rempli dynamiquement par assets/js/admin-app.js -->
            </tbody>
          </table>
          <p class="members-table__empty" id="members-table-empty" hidden>
            No members match your search.
          </p>
        </div>

      </div>

      <!-- ---------- POP-UP DÉTAIL — masquée par défaut, s'affiche
           par-dessus le tableau au clic sur une ligne ---------- -->
      <div id="member-detail-view" class="modal-overlay" hidden>
        <div class="modal-panel">
          <button type="button" class="modal-close" id="member-detail-close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"/>
              <path d="M6 6l12 12"/>
            </svg>
          </button>
          <div id="member-detail-content">
            <!-- Rempli dynamiquement par assets/js/admin-app.js -->
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/admin-app.js"></script>

</body>
</html>
